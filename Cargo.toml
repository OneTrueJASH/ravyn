[package]
name = "ravyn"
version = "0.1.0"
edition = "2021"
description = "RAVYN (Racing Arms by Value: Ȳ over n): a crossword-game analysis engine"
license = "MIT"
repository = "https://github.com/OneTrueJASH/ravyn"
documentation = "https://docs.rs/ravyn"
keywords = ["crossword", "word-game", "scrabble", "monte-carlo", "engine"]
categories = ["games", "algorithms"]
rust-version = "1.88"
readme = "README.md"
# The word list is not part of the package: it is fetched from the data
# repository (`ravyn fetch-data`), kept apart from the code. The leave
# values, RAVYN's own, ship with it.
exclude = ["data/words.fst", "data/crossplay-removed.txt", "/wasm", "/fuzz", "/assets", "/.github"]

[dependencies]
anyhow = "1.0"
fastrand = "2.3.0"
fst = "0.4"
log = "0.4"
rayon = "1.10"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
