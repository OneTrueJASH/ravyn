name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: no job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Fetch the word list
        # From the private data repository: a read-only token in the
        # RAVYN_DATA_TOKEN secret. Without it (pull requests from forks get
        # no secrets) the tests that need the word list skip.
        env:
          RAVYN_DATA_TOKEN: ${{ secrets.RAVYN_DATA_TOKEN }}
        run: |
          if [ -n "$RAVYN_DATA_TOKEN" ]; then
            cargo run --release --bin ravyn -- fetch-data --data .
          else
            echo "::warning::RAVYN_DATA_TOKEN is not set: tests that need the word list will skip"
          fi
      - run: cargo test --release

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets
