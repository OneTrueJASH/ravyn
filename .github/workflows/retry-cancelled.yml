name: Retry cancelled CI

# GitHub sometimes cancels a job because no runner was free (most often
# macOS). When a CI run ends with a job cancelled and none failed, re-run
# the cancelled jobs, at most twice. A real failure is never retried.
# Nothing from the run is checked out or executed: only its ID is used.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run cancelled jobs when nothing failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "Attempt $ATTEMPT already: not retrying again."
            exit 0
          fi
          conclusions=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --paginate --jq '.jobs[].conclusion')
          if echo "$conclusions" | grep -qx failure; then
            echo "A job failed: not retrying."
            exit 0
          fi
          if ! echo "$conclusions" | grep -qx cancelled; then
            echo "No cancelled job: nothing to retry."
            exit 0
          fi
          echo "Re-running the cancelled jobs of run $RUN (attempt $ATTEMPT)."
          gh run rerun "$RUN" --repo "$REPO" --failed
