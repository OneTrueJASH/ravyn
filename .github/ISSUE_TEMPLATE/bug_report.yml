name: Bug report
description: Something works wrongly or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or keys, and the position if it matters (a GCG file or the board and racks).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `--version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Ubuntu 24.04, Windows 11...
